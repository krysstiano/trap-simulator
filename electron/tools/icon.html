<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:transparent}
  canvas{display:block}
</style></head><body>
<canvas id="c" width="512" height="512"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
// tlo: ciemny granat gradient
const g=x.createLinearGradient(0,0,512,512);
g.addColorStop(0,'#0a0e1a'); g.addColorStop(1,'#1a2440');
x.fillStyle=g; x.fillRect(0,0,512,512);
// subtelna ramka zlota
x.strokeStyle='rgba(241,196,15,0.55)'; x.lineWidth=10;
x.strokeRect(20,20,472,472);
x.textAlign='center'; x.textBaseline='middle';
// TRAP — duze, zlote z poswiata magenta
x.shadowColor='#e91e8c'; x.shadowBlur=50;
x.fillStyle='#f1c40f';
x.font='900 150px Arial Black, Arial, sans-serif';
x.fillText('TRAP',256,205);
// SIMULATOR — mniejsze, blekitne
x.shadowBlur=16; x.shadowColor='rgba(126,200,227,0.85)';
x.fillStyle='#7ec8e3';
x.font='800 70px Arial Black, Arial, sans-serif';
x.fillText('SIMULATOR',256,330);
// znak 18+ maly w rogu
x.shadowBlur=0;
x.fillStyle='#e74c3c';
x.beginPath(); x.arc(430,86,40,0,Math.PI*2); x.fill();
x.fillStyle='#fff'; x.font='900 34px Arial, sans-serif';
x.fillText('18+',430,90);
window._iconReady=true;
</script>
</body></html>
