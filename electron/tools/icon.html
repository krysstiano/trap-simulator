<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:transparent}
  canvas{display:block}
</style></head><body>
<canvas id="c" width="512" height="512"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
// Ikona aplikacji — BOLD i czytelna takze przy 32/48px. Jedno slowo TRAP wypelnia ikone.
// tlo: ciemny granat gradient
const g=x.createLinearGradient(0,0,512,512);
g.addColorStop(0,'#0b1020'); g.addColorStop(1,'#1c2748');
x.fillStyle=g; x.fillRect(0,0,512,512);
// delikatna poswiata radialna w centrum (glebia)
const rg=x.createRadialGradient(256,236,30,256,236,300);
rg.addColorStop(0,'rgba(233,30,140,0.28)'); rg.addColorStop(1,'rgba(233,30,140,0)');
x.fillStyle=rg; x.fillRect(0,0,512,512);
// ramka zlota
x.strokeStyle='rgba(241,196,15,0.75)'; x.lineWidth=16;
x.strokeRect(26,26,460,460);
// TRAP — duze, zlote, z neonowa poswiata; dopasowane na szerokosc
x.textAlign='center'; x.textBaseline='middle';
x.shadowColor='#e91e8c'; x.shadowBlur=46;
x.fillStyle='#f1c40f';
let fs=200; x.font='900 '+fs+'px "Arial Black", Arial, sans-serif';
while(x.measureText('TRAP').width>404 && fs>80){ fs-=4; x.font='900 '+fs+'px "Arial Black", Arial, sans-serif'; }
x.fillText('TRAP',256,262);
// cienki highlight u gory liter (subtelny polysk)
x.shadowBlur=0;
window._iconReady=true;
</script>
</body></html>
