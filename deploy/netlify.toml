# Konfiguracja Netlify dla Snowy Simulator (single-file HTML5 game)
# Wrzucaj CALY ten folder `deploy/` metoda drag-and-drop do Netlify.

[build]
  publish = "."

# ── WYLACZ post-processing / asset optimization ──
# Minifikacja inline-JS w pliku ~5 MB potrafi uszkodzic logike gry
# (objawy: brak wejscia do budynku, falszywe "juz dzis zrobione").
[build.processing]
  skip_processing = true

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = false

[build.processing.images]
  compress = false
