name: Build & Release (Trap Simulator)

# Wyzwalane przy wypchnieciu tagu wersji, np. v2.3.34
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # potrzebne zeby electron-builder mogl utworzyc Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zaleznosci (electron/)
        working-directory: electron
        run: npm install

      - name: Build instalatora + publikacja na GitHub Releases
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # bez podpisu (obejscie winCodeSign)
        run: npm run dist -- --publish always
