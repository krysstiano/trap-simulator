name: Deploy website → Cloudflare Pages

# Auto-publikacja strony przy KAŻDYM pushu na main, który dotyka strony lub gry (web-demo).
# Token siedzi bezpiecznie w GitHub Secrets — nie trzeba go nigdzie wpisywać ręcznie.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'index.html'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch: {}   # pozwala odpalić ręcznie z zakładki Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Generuje patchnotes.json + web-demo website/play/index.html z single-source index.html
      - name: Build (patchnotes + web-demo)
        run: node website/gen-patchnotes.cjs

      # Wgrywa folder website/ na Cloudflare Pages (projekt trap-simulator) — bez budowania na Cloudflare
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy website --project-name=trap-simulator --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
