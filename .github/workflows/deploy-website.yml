name: Deploy website → Cloudflare Pages

# Auto-publikacja strony przy KAŻDYM pushu na main, który dotyka strony lub gry (web-demo).
# Token siedzi bezpiecznie w GitHub Secrets — nie trzeba go nigdzie wpisywać ręcznie.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'index.html'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch: {}   # pozwala odpalić ręcznie z zakładki Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Generuje patchnotes.json + web-demo website/play/index.html z single-source index.html
      - name: Build (patchnotes + web-demo)
        run: node website/gen-patchnotes.cjs

      # Diagnostyka: czy sekrety w ogóle są ustawione (nazwa/wartość) — bez ujawniania wartości
      - name: Check secrets present
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$T" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret missing/empty"; exit 1; }
          [ -n "$A" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret missing/empty"; exit 1; }
          echo "secrets present (token len=${#T}, account len=${#A})"

      # Oficjalna akcja Cloudflare — wgrywa website/ na Pages (pewniejsza w CI)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=trap-simulator --branch=main --commit-dirty=true
