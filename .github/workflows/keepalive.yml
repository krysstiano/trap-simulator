name: Supabase keepalive (anty-pauza free tier)

# Free tier Supabase usypia projekt po ~7 dniach bezczynnosci.
# Ping co 3 dni trzyma go aktywnym (margines pod 7 dni).
# Klucz to PUBLISHABLE/anon (i tak publiczny w kliencie) — RLS chroni dane.
on:
  schedule:
    - cron: '0 6 */3 * *'   # co 3 dni, 06:00 UTC
  workflow_dispatch:         # mozna odpalic recznie

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          KEY="sb_publishable_-NYZzyiOkL83IEQPTUuvLQ_LpIfl4h6"
          URL="https://hscprggvkooyqjrrqhsc.supabase.co/rest/v1/leaderboard?select=user_id&limit=1"
          CODE=$(curl -fsS "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null -w "%{http_code}")
          echo "Supabase ping HTTP $CODE"
          # 200/206 = OK; cokolwiek innego = blad (projekt mogl usnac lub klucz zly)
          if [ "$CODE" != "200" ] && [ "$CODE" != "206" ]; then
            echo "::error::Supabase ping zwrocil $CODE — sprawdz projekt/klucz"
            exit 1
          fi
