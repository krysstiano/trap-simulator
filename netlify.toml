# Netlify: serwuj statyczna strone z folderu website/ (landing + pobieranie + patch notes).
# build command regeneruje patchnotes.json z PATCH_NOTES w index.html (single source) przy
# KAZDYM deployu — changelog na stronie nigdy sie nie zestarzeje wzgledem gry (zero gapow).
[build]
  command = "node website/gen-patchnotes.cjs"
  publish = "website"
